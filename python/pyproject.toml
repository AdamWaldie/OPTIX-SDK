[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "optix-intel"
version = "0.1.0"
description = "Official Python SDK for the OPTIX Threat Intelligence REST API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "OPTIX" }]
keywords = ["optix", "threat-intelligence", "cti", "stix", "taxii", "ioc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.25,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "respx>=0.20",
  "mypy>=1.5",
]

[project.urls]
Homepage = "https://github.com/example/optix"
Documentation = "https://example.com/api-docs"
Issues = "https://github.com/example/optix/issues"

[tool.hatch.build.targets.wheel]
packages = ["optix_intel"]

[tool.hatch.build.targets.sdist]
include = [
  "optix_intel/**",
  "tests/**",
  "examples/**",
  "README.md",
  "CHANGELOG.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true
